<meta charset="utf-8">
<title>Csendkert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: kőkert-szerű app – bal oldali csendes sín (asztali), alsó fülsor (mobil), középen ~44rem-es olvasóoszlop. */
:root {
  --bg: #ECEFEA;          /* hajnali köd */
  --surface: #F7F8F4;     /* rizspapír */
  --surface-2: #E1E7E0;   /* moha árnyék */
  --ink: #1C2926;         /* tus */
  --muted: #5A6964;
  --line: #CFD8D0;
  --jade: #2D6A5A;        /* jáde – fő akcent */
  --jade-ink: #F4F8F5;
  --jade-soft: #D3E5DC;
  --gold: #8E6F24;        /* templomarany – másodlagos */
  --gold-soft: #EEE4C8;
  --a-jelenlet: #4D6B88;
  --a-irigyseg: #9A7420;
  --a-joindulat: #A0546A;
  --a-elfogadas: #2B7660;
  --a-onallosag: #5B5B97;
  --a-magabiztossag: #A65C2E;
  --shadow: 0 1px 2px rgba(28,41,38,.05), 0 8px 24px -12px rgba(28,41,38,.18);
  --f-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-quote: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #17201C; --surface-2: #1F2A26; --ink: #E1E8E3; --muted: #97A69F; --line: #2A3631;
    --jade: #7DC1A7; --jade-ink: #0F1A16; --jade-soft: #1D3a31; --gold: #D6B66A; --gold-soft: #39311F;
    --a-jelenlet: #8EAED0; --a-irigyseg: #D9B45A; --a-joindulat: #DC93A7; --a-elfogadas: #72C2A3; --a-onallosag: #A3A3DE; --a-magabiztossag: #E39A6A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #17201C; --surface-2: #1F2A26; --ink: #E1E8E3; --muted: #97A69F; --line: #2A3631;
  --jade: #7DC1A7; --jade-ink: #0F1A16; --jade-soft: #1D3a31; --gold: #D6B66A; --gold-soft: #39311F;
  --a-jelenlet: #8EAED0; --a-irigyseg: #D9B45A; --a-joindulat: #DC93A7; --a-elfogadas: #72C2A3; --a-onallosag: #A3A3DE; --a-magabiztossag: #E39A6A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--jade); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: clamp(2rem, 4.4vw, 2.85rem); }
h2 { font-size: clamp(1.45rem, 3vw, 1.8rem); }
h3 { font-size: 1.22rem; }
p { margin: 0; }
.eyebrow { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.num { font-variant-numeric: tabular-nums; }

/* ---- shell ---- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; padding: 28px 18px 22px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 26px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); padding: 0 8px; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; display: block; line-height: 1; }
.brand span { font-size: .78rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.nav a.on svg { color: var(--jade); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.rail-foot .ambient { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: .9rem; }
.rail-foot a { font-size: .85rem; color: var(--muted); padding: 0 12px; text-decoration: none; }
.rail-foot a:hover { color: var(--ink); }

.main { min-width: 0; padding-inline: clamp(16px, 4vw, 56px); padding-block: 40px 96px; }
.col { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.col.wide { max-width: 64rem; }

.tabbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; }
  .main { padding-block: 22px 110px; }
  .topbar { display: flex !important; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--muted); text-decoration: none; padding: 6px 0; border-radius: 8px; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a.on { color: var(--jade); font-weight: 600; }
}
.topbar { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.topbar .brand b { font-size: 1.25rem; }
.topbar .brand svg { width: 30px; height: 30px; }

/* ---- primitives ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 999px; border: 1px solid transparent; background: var(--jade); color: var(--jade-ink); font-weight: 600; cursor: pointer; text-decoration: none; transition: transform .15s ease, filter .15s ease; font-size: .97rem; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.soft { background: var(--jade-soft); color: var(--ink); }
.btn.sm { padding: 7px 14px; font-size: .88rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border-radius: var(--r); padding: clamp(18px, 3vw, 28px); box-shadow: var(--shadow); min-width: 0; }
.plain { padding: 0; background: none; box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.focus { background: var(--gold-soft); color: var(--gold); }
.chip.dev { background: var(--jade-soft); color: var(--jade); }
.chip.str { background: var(--surface-2); color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--c, var(--jade)); }
.bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--jade)); border-radius: 6px; transition: width .6s ease; }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
.linkcard { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; transition: transform .2s ease; cursor: pointer; border: 0; text-align: left; }
.linkcard:hover { transform: translateY(-2px); }
.linkcard .t { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.25; }
.linkcard .d { font-size: .9rem; color: var(--muted); }
.icon-tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--jade-soft); color: var(--jade); }
.icon-tile svg { width: 22px; height: 22px; }

/* ---- hero ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; }
.hero .greet { font-family: var(--f-quote); font-style: italic; font-size: 1.15rem; color: var(--muted); }
.hero p.lead { font-size: 1.08rem; color: var(--muted); max-width: 34rem; margin-top: 10px; }
.enso-btn { display: block; width: 168px; height: 168px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); position: relative; }
.enso-btn svg { width: 100%; height: 100%; animation: enso-breathe 10s ease-in-out infinite; }
.enso-btn span { position: absolute; inset: 0; display: grid; place-items: center; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
@keyframes enso-breathe { 0%,100% { transform: scale(.9); } 50% { transform: scale(1); } }
@media (max-width: 600px) { .hero { grid-template-columns: 1fr; } .enso-btn { width: 120px; height: 120px; justify-self: start; } }

.steps3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 18px; }
.steps3 > div { display: flex; flex-direction: column; gap: 6px; }
.steps3 b { font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; }
.steps3 .n { font-family: var(--f-display); font-size: 1.6rem; color: var(--gold); line-height: 1; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.stats div { background: var(--surface); border-radius: var(--r-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: .78rem; color: var(--muted); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* ---- wisdom ---- */
.wisdom { position: relative; background: var(--surface); border-radius: var(--r); padding: clamp(22px, 4vw, 36px); overflow: hidden; }
.wisdom .glyph { position: absolute; right: -6px; bottom: -34px; font-size: 9rem; line-height: 1; color: var(--ink); opacity: .05; font-family: serif; pointer-events: none; }
.wisdom q { display: block; font-family: var(--f-quote); font-style: italic; font-size: clamp(1.2rem, 2.6vw, 1.45rem); line-height: 1.45; quotes: "„" "”"; position: relative; }
.wisdom cite { display: block; margin-top: 12px; font-style: normal; font-size: .85rem; color: var(--muted); letter-spacing: .02em; position: relative; }

/* ---- test ---- */
.q-wrap { display: flex; flex-direction: column; gap: 26px; }
.q-progress { display: flex; align-items: center; gap: 14px; }
.q-progress .bar { flex: 1; }
.q-text { font-family: var(--f-display); font-size: clamp(1.4rem, 3.4vw, 1.9rem); line-height: 1.3; min-height: 4.2em; text-wrap: balance; }
.scale { display: flex; flex-direction: column; gap: 8px; }
.scale button { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; font-weight: 500; transition: border-color .15s, background .15s; }
.scale button:hover { border-color: var(--jade); }
.scale button.sel { border-color: var(--jade); background: var(--jade-soft); }
.scale .pip { display: inline-flex; gap: 4px; flex: none; }
.scale .pip i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.scale .pip i.f { background: var(--jade); }
.scale kbd { margin-left: auto; font-family: var(--f-body); font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

/* ---- results ---- */
.radar-wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.radar-wrap svg { width: 100%; height: auto; max-width: 440px; display: block; margin: 0 auto; }
@media (max-width: 1180px) { .radar-wrap { grid-template-columns: 1fr; } }
.area-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; align-items: center; }
.area-row .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.area-row .bar { grid-column: 1 / -1; }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.path li { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--line); }
.path li:last-child { border-bottom: 0; }
.path .idx { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .82rem; font-weight: 600; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.path li.done .idx { background: var(--jade); color: var(--jade-ink); }
.path li.next .idx { background: var(--gold-soft); color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.path a { color: var(--ink); text-decoration: none; font-weight: 500; }
.path a:hover { color: var(--jade); }
.path .meta { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---- area / lesson list ---- */
.area-head { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 18px; align-items: start; }
.area-glyph { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; font-size: 1.9rem; font-family: serif; color: var(--c); background: var(--surface-2); }
.lesson-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.lesson-item { background: var(--surface); border-radius: 12px; padding: 16px 18px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; transition: border-color .2s; }
.lesson-item:hover { border-color: var(--c, var(--jade)); }
.lesson-item .t { font-family: var(--f-display); font-size: 1.1rem; line-height: 1.25; }
.lesson-item .l { font-size: .88rem; color: var(--muted); }
.lesson-item .foot { display: flex; gap: 8px; align-items: center; margin-top: auto; padding-top: 6px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.check { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--jade); color: var(--jade-ink); }
.check svg { width: 12px; height: 12px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: .88rem; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---- lesson page ---- */
.crumbs { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--jade); }
.lesson-head { display: flex; flex-direction: column; gap: 12px; }
.lesson-head .lead { font-family: var(--f-quote); font-style: italic; font-size: 1.25rem; color: var(--muted); line-height: 1.45; }
.prose { display: flex; flex-direction: column; gap: 16px; font-size: 1.05rem; line-height: 1.72; max-width: 40rem; }
.prose strong { font-weight: 600; }
.story { border-left: 2px solid var(--gold); padding: 4px 0 4px 22px; display: flex; flex-direction: column; gap: 12px; }
.story h3 { color: var(--gold); font-size: 1.05rem; }
.story p { font-family: var(--f-quote); font-size: 1.12rem; line-height: 1.6; }
.practice ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.practice li label { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 12px; padding: 10px 8px; border-radius: 10px; cursor: pointer; align-items: start; }
.practice li label:hover { background: var(--surface-2); }
.practice input[type=checkbox] { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--jade); }
.practice li.ok span { color: var(--muted); }
.task { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 16px; align-items: start; background: var(--gold-soft); border-radius: var(--r); padding: 20px 22px; }
.task .eyebrow { color: var(--gold); }
.task svg { width: 26px; height: 26px; color: var(--gold); }
.note { font-size: .83rem; color: var(--muted); }
textarea, input[type=text], input[type=email] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; line-height: 1.55; resize: vertical; }
textarea { min-height: 96px; }
textarea:focus, input[type=text]:focus, input[type=email]:focus { outline: none; border-color: var(--jade); box-shadow: 0 0 0 3px var(--jade-soft); }
label.q { font-weight: 500; display: block; margin-bottom: 8px; }
.saved { font-size: .78rem; color: var(--jade); opacity: 0; transition: opacity .3s; }
.saved.show { opacity: 1; }
.complete-bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 22px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }

/* ---- players ---- */
.player { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-block: 12px; text-align: center; }
.breath-stage { width: min(78vw, 320px); aspect-ratio: 1; max-width: 100%; position: relative; display: grid; place-items: center; }
.breath-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line); }
.breath-orb { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--jade-soft), color-mix(in srgb, var(--jade) 45%, var(--jade-soft)) 75%); transform: scale(.5); transition-property: transform; transition-timing-function: cubic-bezier(.45,.05,.55,.95); box-shadow: 0 20px 60px -20px color-mix(in srgb, var(--jade) 60%, transparent); }
.breath-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
.breath-label b { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; }
.breath-label span { font-size: 2.4rem; font-family: var(--f-display); font-variant-numeric: tabular-nums; line-height: 1; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface); cursor: pointer; font-size: 1.1rem; }
.stepper span { min-width: 76px; text-align: center; font-size: .9rem; font-variant-numeric: tabular-nums; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; color: var(--muted); }
.toggle input { accent-color: var(--jade); width: 17px; height: 17px; }
.med-text { font-family: var(--f-quote); font-size: clamp(1.25rem, 3vw, 1.6rem); line-height: 1.55; min-height: 7.5em; display: flex; align-items: center; justify-content: center; max-width: 34rem; transition: opacity .8s ease; text-wrap: balance; }
.med-text.fade { opacity: 0; }
.ring-svg { width: min(70vw, 260px); height: auto; max-width: 100%; }
.big-time { font-family: var(--f-display); font-size: 3rem; font-variant-numeric: tabular-nums; }

/* ---- wizard ---- */
.wiz-steps { display: flex; gap: 6px; }
.wiz-steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
.wiz-steps i.on { background: var(--jade); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; }
.pills button.on { background: var(--jade); color: var(--jade-ink); border-color: var(--jade); }
input[type=range] { width: 100%; accent-color: var(--jade); }
.summary dl { margin: 0; display: grid; gap: 14px; }
.summary dt { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.summary dd { margin: 4px 0 0; white-space: pre-wrap; }

/* ---- journal ---- */
.moods { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.moods button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .78rem; }
.moods button svg { width: 28px; height: 28px; color: var(--muted); }
.moods button.on { border-color: var(--jade); background: var(--jade-soft); }
.moods button.on svg { color: var(--jade); }
.entry { display: flex; flex-direction: column; gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: 0; }
.entry .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.entry .body { white-space: pre-wrap; }
.entry .x { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .8rem; text-decoration: underline; }

/* ---- challenge ---- */
.days { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; }
.days div { aspect-ratio: 1; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; color: var(--muted); position: relative; font-variant-numeric: tabular-nums; }
.days div.part { background: var(--jade-soft); color: var(--ink); }
.days div.full { background: var(--jade); color: var(--jade-ink); font-weight: 600; }
.days div.today { box-shadow: 0 0 0 2px var(--gold); }
.habit { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 10px; cursor: pointer; }
.habit:hover { background: var(--surface-2); }
.habit input { width: 20px; height: 20px; accent-color: var(--jade); margin: 0; }

/* ---- cards (wisdom deck) ---- */
.deck { perspective: 1000px; }
.deck .wisdom { transition: transform .6s ease, opacity .6s ease; min-height: 230px; display: flex; flex-direction: column; justify-content: center; }

.values-grid { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none; transition: .3s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.footer-note { font-size: .82rem; color: var(--muted); max-width: 40rem; }
.fade-in { animation: fadein .45s ease both; }
@keyframes fadein { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
